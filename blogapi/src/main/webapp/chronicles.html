<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronicles | Vamsi Blogs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #7c3aed;
      --glass-bg: rgba(255, 255, 255, 0.68);
      --glass-hover: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(255, 255, 255, 0.45);
      --text-heading: #2e1065;
      --text-body: #3b2a59;
      --text-muted: #64748b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body {
      min-height: 100vh;
      color: var(--text-body);
      background: linear-gradient(rgba(30, 20, 48, 0.25), rgba(30, 20, 48, 0.45)), url('Dreamy Lavender Reading Nook.png');
      background-size: cover; background-position: center; background-attachment: fixed;
      display: flex; flex-direction: column;
    }
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--glass-border);
      padding: 14px 5%; display: flex; justify-content: space-between; align-items: center;
    }
    .brand-logo { font-family: 'Playfair Display', serif; font-size: 1.55rem; font-weight: 700; color: var(--text-heading); text-decoration: none; }
    .brand-logo span { background: linear-gradient(135deg, #7c3aed, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { color: var(--text-body); text-decoration: none; font-size: 0.95rem; font-weight: 600; }
    .nav-links a.active, .nav-links a:hover { color: var(--primary); }
    .auth-actions { display: flex; gap: 1rem; }
    .btn { font-size: 0.9rem; font-weight: 600; padding: 0.6rem 1.4rem; border-radius: 12px; text-decoration: none; }
    .btn-signin { color: var(--text-heading); border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.6); }
    .btn-signup { background: linear-gradient(135deg, #7c3aed, #6366f1); color: #fff; border: none; }

    .container { max-width: 900px; margin: 0 auto; padding: 4rem 5%; width: 100%; flex: 1; }
    .timeline-title { text-align: center; margin-bottom: 3.5rem; }
    .timeline-title h1 { font-family: 'Playfair Display', serif; font-size: 2.8rem; color: var(--text-heading); margin-bottom: 0.5rem; }
    .timeline-title p { color: var(--text-body); font-size: 1.1rem; }

    .timeline { position: relative; border-left: 2px dashed rgba(124, 58, 237, 0.4); margin-left: 20px; padding-left: 30px; }
    .timeline-item {
      position: relative; margin-bottom: 2.5rem;
      background: var(--glass-bg); backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); border-radius: 18px; padding: 24px 28px;
      box-shadow: 0 8px 24px rgba(76, 29, 149, 0.08); transition: transform 0.25s, background 0.25s;
    }
    .timeline-item:hover { transform: translateX(6px); background: var(--glass-hover); }
    .timeline-dot {
      position: absolute; left: -41px; top: 28px;
      width: 20px; height: 20px; border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      border: 3px solid #fff; box-shadow: 0 0 10px rgba(124, 58, 237, 0.5);
    }
    .timeline-meta { font-size: 0.82rem; font-weight: 700; color: var(--primary); text-transform: uppercase; margin-bottom: 6px; }
    .timeline-item h3 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--text-heading); margin-bottom: 8px; }
    .timeline-item p { font-size: 0.95rem; line-height: 1.7; color: var(--text-body); margin-bottom: 14px; }
    .read-btn { color: var(--primary); font-weight: 600; text-decoration: none; font-size: 0.88rem; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="brand-logo">📜 <span>Vamsi Blogs</span></a>
    <ul class="nav-links">
      <li><a href="explore.html">Explore</a></li>
      <li><a href="chronicles.html" class="active">Chronicles</a></li>
      <li><a href="authors.html">Authors</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <div class="auth-actions">
      <a href="login.html" class="btn btn-signin">Sign In</a>
      <a href="register.html" class="btn btn-signup">Get Started</a>
    </div>
  </header>

  <main class="container">
    <div class="timeline-title">
      <h1>The Grand Timeline</h1>
      <p>A chronological record of every published chapter and thought.</p>
    </div>

    <div class="timeline" id="chroniclesList">
      <!-- Loading state that populates from the same API -->
      <div style="color: var(--text-heading); font-weight: 600;">Loading chronicles...</div>
    </div>
  </main>

  <script>
    async function loadChronicles() {
      const container = document.getElementById('chroniclesList');
      try {
        const res = await fetch('/blogapi/api/latest-stories');
        if (!res.ok) throw new Error();
        const data = await res.json();
        
        container.innerHTML = '';
        data.forEach(item => {
          const excerpt = item.content.length > 150 ? item.content.substring(0, 150) + '...' : item.content;
          const node = document.createElement('div');
          node.className = 'timeline-item';
          node.innerHTML = `
            <div class="timeline-dot"></div>
            <div class="timeline-meta">📅 ${item.postDate} • By ${item.authorName}</div>
            <h3>${item.title}</h3>
            <p>${excerpt}</p>
            <a href="login.html" class="read-btn">Unlock Chapter &rarr;</a>
          `;
          container.appendChild(node);
        });
      } catch (e) {
        container.innerHTML = '<p>Could not fetch chronicles. Sign in to view archives.</p>';
      }
    }
    window.onload = loadChronicles;
  </script>
</body>
</html>
